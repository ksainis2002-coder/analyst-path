<body>
  <!-- App shell only. Every view is rendered by js/app.js from content/curriculum.json. -->
  <a class="skip-link" href="#main" data-skip>Skip to content</a>

  <header class="rail">
    <div class="container rail__inner">
      <a class="brand" href="#/">The Analyst Path<span class="brand__mark" aria-hidden="true">.</span></a>
      <nav class="level-nav" id="level-nav" aria-label="Levels"></nav>
      <div class="meter" id="progress-meter" aria-live="polite"></div>
    </div>
  </header>

  <div class="container notices" id="notices" role="status"></div>

  <main id="main" tabindex="-1">
    <div class="container view">
      <p class="muted" id="boot-message">Loading…</p>
      <noscript><p>The Analyst Path needs JavaScript to run the live formula console.</p></noscript>
    </div>
  </main>
  <script>
    // Browsers refuse to load ES modules from file:// pages, so app.js never runs there.
    // This classic inline script still does, and explains how to open the app properly.
    if (location.protocol === "file:") {
      document.getElementById("boot-message").innerHTML =
        "This app has to be opened through a local web server, not by double-clicking index.html. " +
        "In this folder run <code>python3 -m http.server 8000</code>, then open <code>http://localhost:8000</code>.";
    }
  </script>

  <footer class="site-footer">
    <div class="container" id="footer"></div>
  </footer>
</body>
